[package]
name = "ssr-client"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
bytemuck = { workspace = true }
ssr-core = { workspace = true }
ssr-protocol = { workspace = true, features = ["net"] }
bevy = { workspace = true, features = ["webp"] }
lightyear = { workspace = true }
bevy_replicon = { workspace = true }
tracing = { workspace = true }
image = { workspace = true }
serde = { workspace = true }
ron = { workspace = true }

[dev-dependencies]
# Для теста валидации WGSL-шейдера света: ошибки шейдера иначе всплывают
# только при запуске клиента (naga создаёт пайплайны лениво).
naga = { version = "29", features = ["wgsl-in"] }
