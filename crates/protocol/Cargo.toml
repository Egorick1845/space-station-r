[package]
name = "ssr-protocol"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
# Сетевой слой для lightyear: опционален, чтобы базовый крейт оставался serde-only (PLAN.md §4)
net = ["dep:lightyear", "dep:bevy_app"]

[dependencies]
serde = { workspace = true }
lightyear = { workspace = true, optional = true }
bevy_app = { workspace = true, optional = true }

[dev-dependencies]
postcard = { workspace = true, features = ["alloc"] }
