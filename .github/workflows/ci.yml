# T0.4 (PLAN.md): PR без зелёного CI нельзя мержить.
# По требованию владельца: НЕ гонять CI на каждый push — только на PR и вручную
# (`gh workflow run ci.yml -R Egorick1845/space-station-r`).
name: CI

on:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Системные зависимости Bevy на Linux (аудио/udev/wayland) — нужны на этапе сборки
      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev \
            libx11-dev libxcb1-dev libxkbcommon-x11-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Build
        run: cargo build --workspace

      - name: Clippy
        run: cargo clippy --workspace -- -D warnings

      - name: Tests
        run: cargo test --workspace
